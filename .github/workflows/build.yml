name: Build PDFs

# Compila todos os guias a cada push/PR.
# Ao enviar uma tag "v*" (ex.: v1.0.0), publica uma Release com os PDFs.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar guias
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache do Tectonic (pacotes TeX baixados)
        uses: actions/cache@v4
        with:
          path: ~/.cache/Tectonic
          key: tectonic-${{ runner.os }}-${{ hashFiles('**/*.tex', '**/*.cls') }}
          restore-keys: tectonic-${{ runner.os }}-

      - name: Instalar Tectonic
        run: |
          cd /tmp
          curl --proto '=https' --tlsv1.2 -fsSL https://drop-sh.fullyjustified.net | sh
          sudo mv tectonic /usr/local/bin/
          tectonic --version

      - name: Compilar PDFs
        run: make dist ENGINE=tectonic

      - name: Enviar PDFs como artefato
        uses: actions/upload-artifact@v4
        with:
          name: PousadaGuides-PDFs
          path: dist/*.pdf
          if-no-files-found: error

      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: PousadaGuides ${{ github.ref_name }}
          files: dist/*.pdf
          generate_release_notes: true
          body: |
            ## 📥 Downloads

            | Guia | Tela | Impressão |
            |---|---|---|
            | **#01 — Piracy Guide** | `PousadaGuide-01-Piracy.pdf` | `PousadaGuide-01-Piracy-impressao.pdf` |
            | **#02 — Privacy Guide** | `PousadaGuide-02-Privacy.pdf` | `PousadaGuide-02-Privacy-impressao.pdf` |
            | #00 — Guia de Exemplo (sistema visual) | `PousadaGuide-00-Exemplo.pdf` | — |

            > A versão de **tela** tem fundo creme; a de **impressão** tem fundo branco.
