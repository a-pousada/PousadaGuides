name: Build & Deploy

# Compila todos os guias a cada push/PR, gera o site estático e publica
# no GitHub Pages (https://a-pousada.github.io/PousadaGuides).
# Ao enviar uma tag "v*" (ex.: v1.3.0), publica uma Release com os PDFs.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Compilar guias e site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache do Tectonic (pacotes TeX baixados)
        uses: actions/cache@v4
        with:
          path: ~/.cache/Tectonic
          key: tectonic-${{ runner.os }}-${{ hashFiles('**/*.tex', '**/*.cls') }}
          restore-keys: tectonic-${{ runner.os }}-

      - name: Cache de vendor do site (PDF.js + fontes IBM Plex)
        uses: actions/cache@v4
        with:
          path: site/.cache
          key: site-vendor-${{ runner.os }}-${{ hashFiles('site/build.py') }}
          restore-keys: site-vendor-${{ runner.os }}-

      - name: Instalar Tectonic
        run: |
          cd /tmp
          curl --proto '=https' --tlsv1.2 -fsSL https://drop-sh.fullyjustified.net | sh
          sudo mv tectonic /usr/local/bin/
          tectonic --version

      - name: Compilar PDFs
        run: make dist ENGINE=tectonic

      - name: Enviar PDFs como artefato
        uses: actions/upload-artifact@v4
        with:
          name: PousadaGuides-PDFs
          path: dist/*.pdf
          if-no-files-found: error

      - name: Gerar site estático (GitHub Pages)
        run: |
          python3 site/build.py --dist dist --out _site

      - name: Upload artefato do GitHub Pages
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: PousadaGuides ${{ github.ref_name }}
          files: dist/*.pdf
          generate_release_notes: true
          body: |
            ## 🌐 Leia Online
            Todos os guias estão disponíveis para leitura direta no navegador, sem baixar nada:
            👉 **[a-pousada.github.io/PousadaGuides](https://a-pousada.github.io/PousadaGuides/)**

            ## 📥 Downloads (PDFs)

            | Guia | Tela | Impressão |
            |---|---|---|
            | **#01 — Piracy Guide** | `PousadaGuide-01-Piracy.pdf` | `PousadaGuide-01-Piracy-impressao.pdf` |
            | **#02 — Privacy Guide** | `PousadaGuide-02-Privacy.pdf` | `PousadaGuide-02-Privacy-impressao.pdf` |
            | **#03 — Bitcoin Guide** | `PousadaGuide-03-Bitcoin.pdf` | `PousadaGuide-03-Bitcoin-impressao.pdf` |
            | #00 — Guia de Exemplo (sistema visual) | `PousadaGuide-00-Exemplo.pdf` | — |

            > A versão de **tela** tem fundo creme; a de **impressão** tem fundo branco.

  deploy:
    name: Publicar no GitHub Pages
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
