<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <rect x="8" y="8" width="112" height="112" rx="24" fill="#18181B" stroke="#D6C38F" stroke-width="3"/>
  <!-- Stainless steel washer M8 outer circle -->
  <circle cx="64" cy="64" r="42" fill="#E4E4E7" stroke="#71717A" stroke-width="3"/>
  <!-- Inner bolt hole -->
  <circle cx="64" cy="64" r="16" fill="#18181B" stroke="#71717A" stroke-width="2.5"/>
  <!-- Cross dividers -->
  <line x1="64" y1="23" x2="64" y2="47" stroke="#71717A" stroke-width="2"/>
  <line x1="64" y1="81" x2="64" y2="105" stroke="#71717A" stroke-width="2"/>
  <line x1="23" y1="64" x2="47" y2="64" stroke="#71717A" stroke-width="2"/>
  <line x1="81" y1="64" x2="105" y2="64" stroke="#71717A" stroke-width="2"/>
  <!-- 1 2 4 8 markings -->
  <text x="50" y="42" fill="#09090B" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">1</text>
  <text x="78" y="42" fill="#09090B" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">2</text>
  <text x="50" y="94" fill="#09090B" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">4</text>
  <text x="78" y="94" fill="#09090B" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">8</text>
  <!-- Center punch mark in quadrant 1 & 8 -->
  <circle cx="48" cy="32" r="2.5" fill="#DC2626"/>
  <circle cx="78" cy="84" r="2.5" fill="#DC2626"/>
</svg>
